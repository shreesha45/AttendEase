
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">AttendEase</h2>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="add-subject.html">Add Subject</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">

        <section class="form-container">

            <h1>Edit Subject</h1>
            <p>Update your subject information.</p>

            <form id="editSubjectForm">

                <input type="hidden" id="editSubjectId" name="subjectId">

                <div class="form-group">
                    <label for="editSubjectName">Subject Name</label>
                    <input
                        type="text"
                        id="editSubjectName"
                        name="subjectName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editTotalClasses">Total Classes Conducted</label>
                    <input
                        type="number"
                        id="editTotalClasses"
                        name="totalClasses"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editAttendedClasses">Classes Attended</label>
                    <input
                        type="number"
                        id="editAttendedClasses"
                        name="attendedClasses"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editClassesPerWeek">Classes Per Week</label>
                    <input
                        type="number"
                        id="editClassesPerWeek"
                        name="classesPerWeek"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editWeeksRemaining">Weeks Remaining</label>
                    <input
                        type="number"
                        id="editWeeksRemaining"
                        name="weeksRemaining"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editRequiredAttendance">
                        Required Attendance Percentage
                    </label>

                    <input
                        type="number"
                        id="editRequiredAttendance"
                        name="requiredAttendance"
                        min="0"
                        max="100"
                        step="0.1"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Update Subject
                    </button>

                    <a href="dashboard.html" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 AttendEase. All Rights Reserved.</p>
    </footer>

    <script src="../js/attendance.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/ui.js"></script>

</body>
</html>
