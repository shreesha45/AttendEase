
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendEase | Add Subject</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">AttendEase</h2>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="subjects.html" class="active">Subjects</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">

        <section class="form-container">

            <h1>Add New Subject</h1>

            <p>Enter the subject information below.</p>

            <form id="subjectForm">

                <div class="form-group">
                    <label for="subjectName">Subject Name</label>
                    <input type="text" id="subjectName"
                        name="subjectName"
                        placeholder="Enter subject name" required>
                </div>

                <div class="form-group">
                    <label for="totalClasses">Total Classes Conducted</label>
                    <input type="number" id="totalClasses"
                        name="totalClasses" min="0" step="1"
                        placeholder="Enter total classes" required>
                </div>

                <div class="form-group">
                    <label for="attendedClasses">Classes Attended</label>
                    <input type="number" id="attendedClasses"
                        name="attendedClasses" min="0" step="1"
                        placeholder="Enter attended classes" required>
                </div>

                <div class="form-group">
                    <label for="classesPerWeek">Classes Per Week</label>
                    <input type="number" id="classesPerWeek"
                        name="classesPerWeek" min="0" step="1"
                        placeholder="Enter classes per week" required>
                </div>

                <div class="form-group">
                    <label for="weeksRemaining">Weeks Remaining</label>
                    <input type="number" id="weeksRemaining"
                        name="weeksRemaining" min="0" step="1"
                        placeholder="Enter remaining weeks" required>
                </div>

                <div class="form-group">
                    <label for="requiredAttendance">
                        Required Attendance Percentage
                    </label>

                    <input type="number" id="requiredAttendance"
                        name="requiredAttendance"
                        min="0" max="100" step="0.1"
                        value="75" required>
                </div>

                <div class="form-actions">

                    <button type="submit" class="btn btn-primary">
                        Save Subject
                    </button>

                    <a href="subjects.html" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 AttendEase. All Rights Reserved.</p>
    </footer>

    <script src="../js/attendance.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/ui.js"></script>

</body>
</html>
